<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Transparent background - no rect fill -->
  <!-- Traffic light body -->
  <rect x="16" y="4" width="32" height="56" rx="6" fill="#1a1a2e"/>
  <!-- Top cap -->
  <rect x="26" y="0" width="12" height="6" rx="3" fill="#16213e"/>
  <!-- Side wings -->
  <polygon points="16,16 6,12 6,20" fill="#1a1a2e"/>
  <polygon points="48,16 58,12 58,20" fill="#1a1a2e"/>
  <polygon points="16,32 6,28 6,36" fill="#1a1a2e"/>
  <polygon points="48,32 58,28 58,36" fill="#1a1a2e"/>
  <polygon points="16,48 6,44 6,52" fill="#1a1a2e"/>
  <polygon points="48,48 58,44 58,52" fill="#1a1a2e"/>
  <!-- Red light -->
  <circle cx="32" cy="16" r="8" fill="#e74c3c"/>
  <circle cx="32" cy="16" r="5" fill="#ff6b6b" opacity="0.6"/>
  <!-- Yellow light -->
  <circle cx="32" cy="32" r="8" fill="#f39c12"/>
  <circle cx="32" cy="32" r="5" fill="#ffd93d" opacity="0.6"/>
  <!-- Green light -->
  <circle cx="32" cy="48" r="8" fill="#27ae60"/>
  <circle cx="32" cy="48" r="5" fill="#6bcb77" opacity="0.6"/>
</svg>
